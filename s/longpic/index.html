<script>(() => {
 const $ = id => document.getElementById(id);
 const picker = $('picker'), drop = $('drop'), status = $('status');
 picker.accept = '.pdf,application/pdf';
 let library, task, active = false, cancelled = false, objectURL;
 const show = name => ['idle','working','result'].forEach(id => {$(id).classList.remove('initial-hidden'); $(id).hidden = id !== name;});
 const say = (message, error = false) => {status.textContent = message; status.classList.toggle('error', error);};
 const release = () => {if(objectURL) URL.revokeObjectURL(objectURL); objectURL = null; $('output').removeAttribute('src'); $('download').removeAttribute('href');};
 const loadLibrary = () => library ||= import('https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.149/build/pdf.min.mjs').then(pdfjs => {
  pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.149/build/pdf.worker.min.mjs';
  return pdfjs;
 }).catch(() => {library = null; throw new Error('Could not load the PDF reader. Check your connection and try again.');});
 const check = () => {if(cancelled) throw new Error('Cancelled');};
 const encode = (canvas, quality) => new Promise((resolve, reject) => canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('This browser could not create the image. Try a smaller PDF.')), 'image/jpeg', quality));
 async function convert(file) {
  if(active || !file) return;
  if(!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') {say('Choose a PDF file to get started.', true); return;}
  if(file.size > 150 * 1024 * 1024) {say('This PDF is too large for this tool. Choose a file under 150 MB.', true); return;}
  active = true; cancelled = false; release(); show('working'); $('bar').style.width = '0%'; say('Opening your PDF…');
  let pdf, canvas;
  try {
   const pdfjs = await loadLibrary(); check();
   const data = new Uint8Array(await file.arrayBuffer()); check();
   const base = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.149/';
   task = pdfjs.getDocument({data, isEvalSupported:false, cMapUrl:base+'cmaps/', cMapPacked:true, standardFontDataUrl:base+'standard_fonts/', wasmUrl:base+'wasm/'});
   task.onPassword = () => {cancelled = false; task.destroy(); say('This PDF is password-protected. Save an unlocked copy and try again.', true);};
   pdf = await task.promise; check();
   if(pdf.numPages > 500) throw new Error('Please use a PDF with 500 pages or fewer.');
   const pages = []; let maxWidth = 0, totalHeight = 0;
   for(let i = 1; i <= pdf.numPages; i++) {
    check(); const page = await pdf.getPage(i), view = page.getViewport({scale:1});
    pages.push({width:view.width,height:view.height}); maxWidth = Math.max(maxWidth, view.width); totalHeight += view.height; page.cleanup();
    say(`Measuring page ${i} of ${pdf.numPages}…`);
   }
   const maxHeight = 8192; // Fit every page automatically within browser-friendly image limits.
   let scale = Math.min(1600/maxWidth, (maxHeight-pages.length)/totalHeight, Math.sqrt(15000000/(maxWidth*totalHeight)));
   let width = Math.max(1,Math.floor(maxWidth*scale));
   let heights = pages.map(p => Math.ceil(p.height*scale)), height = heights.reduce((a,b)=>a+b,0);
   canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
   const context = canvas.getContext('2d');
   if(!context) throw new Error('Your browser could not create the image. Try a smaller PDF.');
   context.fillStyle = '#ffffff'; context.fillRect(0,0,width,height);
   let y = 0;
   for(let i = 1; i <= pdf.numPages; i++) {
    check(); say(`Stitching page ${i} of ${pdf.numPages}…`);
    const page = await pdf.getPage(i), view = page.getViewport({scale});
    await page.render({canvasContext:context,viewport:view,transform:[1,0,0,1,Math.max(0,(width-view.width)/2),y],background:'rgba(0,0,0,0)'}).promise;
    y += heights[i-1]; page.cleanup(); $('bar').style.width = `${i/pdf.numPages*100}%`;
    await new Promise(resolve => setTimeout(resolve,0));
   }
   check(); say('Packing your JPG…');
   let blob = await encode(canvas,.92); check();
   for(const quality of [.82,.68,.5]) {if(blob.size <= 4800000) break; blob = await encode(canvas,quality); check();}
   objectURL = URL.createObjectURL(blob); $('output').src = objectURL;
   $('download').href = objectURL; $('download').download = file.name.replace(/\.pdf$/i,'')+'-longpic.jpg';
   $('details').textContent = `${pdf.numPages} ${pdf.numPages === 1 ? 'page' : 'pages'} · ${width.toLocaleString()} × ${height.toLocaleString()} px · ${(blob.size/1000000).toFixed(2)} MB`;
   show('result');
   say(height/width > 8 ? 'A very long pic! Social apps may shrink it; full-size text may be small.' : '');
   if(blob.size > 5000000) say('Your JPG is ready. The file is larger than 5 MB.');
  } catch(error) {
   show('idle');
   if(cancelled) say('Cancelled. Ready when you are.');
   else if(!status.classList.contains('error')) say(error.name === 'InvalidPDFException' ? 'That PDF could not be read. Try another file.' : error.message || 'Could not convert this PDF. Try another file.', true);
  } finally {
   if(canvas) {canvas.width = 0; canvas.height = 0;}
   try {if(task) await task.destroy();} catch {}
   task = null; active = false; picker.value = '';
  }
 }
 drop.onclick = () => picker.click();
 picker.onchange = () => convert(picker.files[0]);
 for(const name of ['dragenter','dragover']) document.addEventListener(name,event => {event.preventDefault(); if(!active) drop.classList.add('dragging');});
 document.addEventListener('dragleave',event => {if(!event.relatedTarget) drop.classList.remove('dragging');});
 document.addEventListener('drop',event => {event.preventDefault(); drop.classList.remove('dragging'); if(event.dataTransfer.files.length !== 1) {if(!active) say('Drop one PDF at a time.',true); return;} convert(event.dataTransfer.files[0]);});
 $('cancel').onclick = () => {cancelled = true; say('Cancelling…'); if(task) task.destroy();};
 $('reset').onclick = () => {release(); show('idle'); say('');};
 window.addEventListener('pagehide',release);
})();</script>
