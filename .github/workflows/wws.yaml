name: Build and Deploy Scroll

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install and Build
        run: |
          npm install -g breck7/scroll
          scroll list | scroll build
          # Include generated files in the deployment.
          rm .gitignore
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: wws
          folder: .
